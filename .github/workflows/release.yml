name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # skills/ is what `npx skills add` installs, straight from the Git tree.
      # Only the release rebuilds it, so on any other commit it must still match
      # the last release tag. A hand edit or a stray local build that slipped
      # past the pre-commit guard fails here instead of being installed.
      - name: Verify skills/ matches the last release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git diff --exit-code --stat "$tag" -- skills/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # The code review gate validates every emitted review.xml against the
      # vendored XSD by shelling out to xmllint, so the suite exercising it
      # needs a real validator. Not preinstalled on ubuntu-latest.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0
        run: npx semantic-release
