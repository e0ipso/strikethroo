name: Pull Request Validation

# pull_request (not pull_request_target): the job runs with the fork's
# read-only token and never sees repository secrets.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and Lint
    # Keep the OS within the locked Playwright version's supported platforms.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed for the skills/ check below.
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config so no
          # dependency install, build, or test step can reach it.
          persist-credentials: false

      # skills/ is what `npx skills add` installs, straight from the Git tree.
      # Only the release rebuilds it, so on any other commit it must still match
      # the last release tag. A hand edit or a stray local build that slipped
      # past the pre-commit guard fails here instead of being installed.
      - name: Verify skills/ matches the last release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git diff --exit-code --stat "$tag" -- skills/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # The code review gate validates every emitted review.xml against the
      # vendored XSD by shelling out to xmllint, so the suite exercising it
      # needs a real validator. Not preinstalled on the runner.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      # Full-lockfile audit (dev included) using security/audit-ci.json.
      - name: Dependency security check
        run: npm run security:check
